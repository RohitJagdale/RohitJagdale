<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1054" viewBox="0 0 1200 1054" role="img" aria-labelledby="title">
<title id="title">Projects: MCP Servers for Jira &amp; CVMS (MODEL CONTEXT PROTOCOL Â· IDE): Python MCP servers that let AI agents in VS Code and Kiro IDE fetch context, analyse issues and run developer workflows from the editor. Risk-Remediation Agent (AWS BEDROCK Â· GITLAB CI/CD): An agent in GitLab CI/CD that fetches CVMS software-risk issues, analyses them and opens merge requests with AI-proposed fixes. AI Code Review System (BEDROCK Â· LAMBDA Â· PROMPTS): Parses merge-request diffs, writes contextual line-level feedback and de-duplicates comments across review cycles. StationTwin (METRO DIGITAL TWIN): Real-time 3D twin of metro stations: React + Three.js, GraphQL on AppSync, GenAI summaries every 8 hours, all in AWS CDK. Results: â–²40% faster 3D loads, â–²50% faster releases, â–¼25% latency. Customer Onboarding Portal (REACT Â· SERVERLESS Â· DYNAMODB Â· RDS): Multi-step site-configuration portal with per-stage validation, two-phase storage in DynamoDB and RDS PostgreSQL, and pre-signed S3 uploads for documents and 3D models.</title>
<style>
.sans{font-family:'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.twinkle{animation:twinkle 4s ease-in-out infinite}
.aurora{animation:aurora 16s ease-in-out infinite alternate}
.aurora.b{animation-duration:21s;animation-direction:alternate-reverse}
.glow{animation:glow 6s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
.sweep{animation:sweep 9s ease-in-out infinite}
.grid{animation:grid 2.4s linear infinite}
.drone{animation:drone 14s ease-in-out infinite alternate}
.wave{animation:wave 14s linear infinite}
.wave.b{animation-duration:22s;animation-direction:reverse}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes aurora{from{transform:translate(-40px,0)}to{transform:translate(60px,18px)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes grid{from{transform:translateY(0)}to{transform:translateY(24px)}}
@keyframes drone{from{transform:translate(0,0)}to{transform:translate(-140px,26px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
