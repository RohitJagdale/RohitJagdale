<svg xmlns="http://www.w3.org/2000/svg" width="800" height="208" viewBox="0 0 800 208" role="img" aria-labelledby="title">
<title id="title">05 // Contribution trail — public contributions, eaten by a snake.</title>
<style>
.sans{font-family:'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.twinkle{animation:twinkle 4s ease-in-out infinite}
.aurora{animation:aurora 16s ease-in-out infinite alternate}
.aurora.b{animation-duration:21s;animation-direction:alternate-reverse}
.glow{animation:glow 6s ease-in-out infinite}
.cursor{animation:blink 1.1s steps(1) infinite}
.sweep{animation:sweep 9s ease-in-out infinite}
.grid{animation:grid 2.4s linear infinite}
.drone{animation:drone 14s ease-in-out infinite alternate}
.wave{animation:wave 14s linear infinite}
.wave.b{animation-duration:22s;animation-direction:reverse}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes aurora{from{transform:translate(-40px,0)}to{transform:translate(60px,18px)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes sweep{0%{transform:translateX(-30%)}100%{transform:translateX(130%)}}
@keyframes grid{from{transform:translateY(0)}to{transform:translateY(24px)}}
@keyframes drone{from{transform:translate(0,0)}to{transform:translate(-140px,26px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-600px)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2BD6"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#FF2BD6"/>
</linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0C1130"/><stop offset="1" stop-color="#080B1D"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#00E5FF" stop-opacity=".6"/><stop offset=".45" stop-color="#A855F7" stop-opacity=".25"/>
  <stop offset="1" stop-color="#FF2BD6" stop-opacity=".5"/>
</linearGradient>
<linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#141A3D"/><stop offset="1" stop-color="#0E1230"/>
</linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".07"/>
  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glowCyan"><stop offset="0" stop-color="#00E5FF" stop-opacity=".45"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glowViolet"><stop offset="0" stop-color="#A855F7" stop-opacity=".55"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
<radialGradient id="glowPink"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".4"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>
</defs>
<clipPath id="clip"><rect width="800" height="208" rx="28"/></clipPath>
<g clip-path="url(#clip)">
<rect width="800" height="208" fill="url(#card)"/>
<ellipse cx="720" cy="0" rx="280" ry="94" fill="url(#glowViolet)" opacity=".55"/>
<ellipse cx="0" cy="208" rx="240" ry="73" fill="url(#glowCyan)" opacity=".35"/>
</g>
<rect x=".75" y=".75" width="798.5" height="206.5" rx="27.5" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="48" y="0" width="120" height="3" rx="1.5" fill="url(#accent)"/>
<text x="48.0" y="72.0" class="mono" font-size="22" font-weight="600" fill="#00E5FF" text-anchor="start" letter-spacing="4">05 // CONTRIBUTION TRAIL</text>
<text x="48.0" y="134.0" class="sans" font-size="46" font-weight="700" fill="#EEF1FF" text-anchor="start">Every commit feeds the snake</text><text x="48.0" y="180.0" class="sans" font-size="28" font-weight="500" fill="#A3ACCF" text-anchor="start">Public contributions · refreshed daily</text>
</svg>
