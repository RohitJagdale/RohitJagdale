  <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<radialGradient id="glowCyan"><stop offset="0" stop-color="#00E5FF" stop-opacity=".45"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
<radialGradient id="glowViolet"><stop offset="0" stop-color="#A855F7" stop-opacity=".55"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
<radialGradient id="glowPink"><stop offset="0" stop-color="#FF2BD6" stop-opacity=".4"/><stop offset="1" stop-color="#FF2BD6" stop-opacity="0"/></radialGradient>

<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#04050E"/><stop offset=".6" stop-color="#120B33"/><stop offset="1" stop-color="#2A0E45"/>
</linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#1A0A3A"/><stop offset="1" stop-color="#04050E"/>
</linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFE29A"/><stop offset=".45" stop-color="#FFB020"/><stop offset="1" stop-color="#FF2BD6"/>
</linearGradient>
<radialGradient id="sunHalo"><stop offset=".4" stop-color="#FF2BD6" stop-opacity=".4"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
</defs>

